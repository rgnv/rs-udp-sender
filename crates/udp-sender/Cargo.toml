[package]
name = "udp-sender"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rs-udp-sender"
path = "src/main.rs"

[lib]
name = "udp_sender"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
nix = { version = "0.30", features = ["socket", "ioctl"] }
socket2 = { version = "0.6", features = ["all"] }
bytes = "1.10"
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rasn = "0.28"
rasn-snmp = "0.28"
rasn-smi = "0.28"

[features]
root-tests = []

[dev-dependencies]
tempfile = "3.20"
hex = "0.4"
