name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

jobs:
  # ── Gate: tests + version extraction ────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      pkg_version: ${{ steps.version.outputs.PKG_VERSION }}
      is_prerelease: ${{ steps.version.outputs.IS_PRERELEASE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --exclude rs-udp-sender --exclude rs-udp-sender-integration

      - name: Extract version info
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          PKG_VERSION="${VERSION#v}"

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
            echo "Detected pre-release: $VERSION"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
            echo "Detected stable release: $VERSION"
          fi

  # ── Build: cross-compile binaries, archives, checksums, DEB/RPM ────
  build:
    name: Build Artifacts (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            suffix: linux-x64
            bin_suffix: linux-x64
            artifact_name: build-linux-x64
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            suffix: linux-arm64
            bin_suffix: linux-arm64
            artifact_name: build-linux-arm64
            use_cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: darwin
            suffix: darwin-x64
            bin_suffix: darwin-x64
            artifact_name: build-darwin-x64
            use_cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: darwin
            suffix: darwin-arm64
            bin_suffix: darwin-arm64
            artifact_name: build-darwin-arm64
            use_cross: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build rs-udp-sender (cross)
        if: matrix.use_cross
        run: cross build --release --target "${{ matrix.target }}" --workspace

      - name: Build rs-udp-sender (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target "${{ matrix.target }}" --workspace

      - name: Create archive and checksum
        run: |
          mkdir -p dist

          REL_DIR="target/${{ matrix.target }}/release"
          BINARIES="rs-udp-sender rs-udp-packet-generator rs-udp-snmp-trap-generator"

          for BIN in $BINARIES; do
            cp "$REL_DIR/$BIN" "dist/${BIN}-${{ matrix.bin_suffix }}"
          done

          ARCHIVE="rs-udp-sender-${{ needs.test.outputs.version }}-${{ matrix.suffix }}.tar.gz"
          tar -czf "dist/$ARCHIVE" -C dist \
            "rs-udp-sender-${{ matrix.bin_suffix }}" \
            "rs-udp-packet-generator-${{ matrix.bin_suffix }}" \
            "rs-udp-snmp-trap-generator-${{ matrix.bin_suffix }}"
          sha256sum "dist/$ARCHIVE" > "dist/$ARCHIVE.sha256"

          echo "=== Built archive ==="
          ls -lh "dist/$ARCHIVE"
          cat "dist/$ARCHIVE.sha256"

      - name: Install packaging tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm libcap2-bin
          sudo gem install --no-document fpm

      - name: Create DEB and RPM packages
        if: matrix.os == 'linux'
        run: |
          PKG_VERSION="${{ needs.test.outputs.pkg_version }}"

          # Architecture mapping for fpm
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            DEB_ARCH="amd64"
            RPM_ARCH="x86_64"
            PKG_SUFFIX="x64"
          else
            DEB_ARCH="arm64"
            RPM_ARCH="aarch64"
            PKG_SUFFIX="arm64"
          fi

          SUFFIX="${{ matrix.bin_suffix }}"

          # ── DEB package ───────────────────────────────────────────
          fpm -s dir -t deb \
            -n rs-udp-sender -v "$PKG_VERSION" -a "$DEB_ARCH" \
            --description "Rust UDP packet sender with IP/port spoofing support" \
            --url "https://github.com/${{ github.repository }}" \
            --maintainer "Cribl <support@cribl.io>" \
            --license "MIT" --vendor "Cribl, Inc." \
            --after-install scripts/postinstall.sh \
            --before-remove scripts/preremove.sh \
            -p "dist/rs-udp-sender-${PKG_VERSION}-${PKG_SUFFIX}.deb" \
            "dist/rs-udp-sender-${SUFFIX}=/usr/bin/rs-udp-sender" \
            "dist/rs-udp-packet-generator-${SUFFIX}=/usr/bin/rs-udp-packet-generator" \
            "dist/rs-udp-snmp-trap-generator-${SUFFIX}=/usr/bin/rs-udp-snmp-trap-generator"

          # ── RPM package ───────────────────────────────────────────
          fpm -s dir -t rpm \
            -n rs-udp-sender -v "$PKG_VERSION" -a "$RPM_ARCH" \
            --description "Rust UDP packet sender with IP/port spoofing support" \
            --url "https://github.com/${{ github.repository }}" \
            --maintainer "Cribl <support@cribl.io>" \
            --license "MIT" --vendor "Cribl, Inc." \
            --after-install scripts/postinstall.sh \
            --before-remove scripts/preremove.sh \
            -p "dist/rs-udp-sender-${PKG_VERSION}-${PKG_SUFFIX}.rpm" \
            "dist/rs-udp-sender-${SUFFIX}=/usr/bin/rs-udp-sender" \
            "dist/rs-udp-packet-generator-${SUFFIX}=/usr/bin/rs-udp-packet-generator" \
            "dist/rs-udp-snmp-trap-generator-${SUFFIX}=/usr/bin/rs-udp-snmp-trap-generator"

          sha256sum "dist/rs-udp-sender-${PKG_VERSION}-${PKG_SUFFIX}.deb" > "dist/rs-udp-sender-${PKG_VERSION}-${PKG_SUFFIX}.deb.sha256"
          sha256sum "dist/rs-udp-sender-${PKG_VERSION}-${PKG_SUFFIX}.rpm" > "dist/rs-udp-sender-${PKG_VERSION}-${PKG_SUFFIX}.rpm.sha256"

      - name: Upload matrix artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          retention-days: 30

  # ── Docker: multi-arch container images ─────────────────────────────
  docker:
    name: Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.test.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Release: changelog, release notes, GitHub Release ──────────────
  release:
    name: Create GitHub Release
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download linux x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux-x64
          path: dist

      - name: Download linux arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux-arm64
          path: dist

      - name: Download darwin x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-darwin-x64
          path: dist

      - name: Download darwin arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-darwin-arm64
          path: dist

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_TAG="${{ needs.test.outputs.version }}"
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n 1)

          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          {
            echo "CHANGELOG<<EOF"
            echo ""
            echo "### What's Changed"
            echo ""
            git log --no-merges --pretty=format:'- %s' "$PREVIOUS_TAG..HEAD"
            echo ""
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$CURRENT_TAG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release notes
        env:
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
        run: |
          V="${{ needs.test.outputs.version }}"
          PV="${{ needs.test.outputs.pkg_version }}"
          {
            echo "## rs-udp-sender ${V}"
            echo ""
            if [ "${{ needs.test.outputs.is_prerelease }}" = "true" ]; then
              echo "> ⚠️ **Pre-release**: This is a pre-release version."
              echo ""
            fi
            printf '%s\n' "$CHANGELOG"
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Type | Architecture | File |"
            echo "|------|--------------|------|"
            echo "| Binary tarball | Linux x64 | [\`rs-udp-sender-${V}-linux-x64.tar.gz\`](https://github.com/${{ github.repository }}/releases/download/${V}/rs-udp-sender-${V}-linux-x64.tar.gz) |"
            echo "| Binary tarball | Linux ARM64 | [\`rs-udp-sender-${V}-linux-arm64.tar.gz\`](https://github.com/${{ github.repository }}/releases/download/${V}/rs-udp-sender-${V}-linux-arm64.tar.gz) |"
            echo "| Binary tarball | macOS x64 | [\`rs-udp-sender-${V}-darwin-x64.tar.gz\`](https://github.com/${{ github.repository }}/releases/download/${V}/rs-udp-sender-${V}-darwin-x64.tar.gz) |"
            echo "| Binary tarball | macOS ARM64 | [\`rs-udp-sender-${V}-darwin-arm64.tar.gz\`](https://github.com/${{ github.repository }}/releases/download/${V}/rs-udp-sender-${V}-darwin-arm64.tar.gz) |"
            echo "| DEB package | x64 | [\`rs-udp-sender-${PV}-x64.deb\`](https://github.com/${{ github.repository }}/releases/download/${V}/rs-udp-sender-${PV}-x64.deb) |"
            echo "| DEB package | ARM64 | [\`rs-udp-sender-${PV}-arm64.deb\`](https://github.com/${{ github.repository }}/releases/download/${V}/rs-udp-sender-${PV}-arm64.deb) |"
            echo "| RPM package | x64 | [\`rs-udp-sender-${PV}-x64.rpm\`](https://github.com/${{ github.repository }}/releases/download/${V}/rs-udp-sender-${PV}-x64.rpm) |"
            echo "| RPM package | ARM64 | [\`rs-udp-sender-${PV}-arm64.rpm\`](https://github.com/${{ github.repository }}/releases/download/${V}/rs-udp-sender-${PV}-arm64.rpm) |"
            echo ""
            echo "### Container Image"
            echo "- \`ghcr.io/${{ github.repository }}:${PV}\`"
            echo "- \`ghcr.io/${{ github.repository }}:latest\`"
            echo "- Architectures: linux/amd64, linux/arm64"
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/rs-udp-sender-${{ needs.test.outputs.version }}-linux-x64.tar.gz
            dist/rs-udp-sender-${{ needs.test.outputs.version }}-linux-x64.tar.gz.sha256
            dist/rs-udp-sender-${{ needs.test.outputs.version }}-linux-arm64.tar.gz
            dist/rs-udp-sender-${{ needs.test.outputs.version }}-linux-arm64.tar.gz.sha256
            dist/rs-udp-sender-${{ needs.test.outputs.version }}-darwin-x64.tar.gz
            dist/rs-udp-sender-${{ needs.test.outputs.version }}-darwin-x64.tar.gz.sha256
            dist/rs-udp-sender-${{ needs.test.outputs.version }}-darwin-arm64.tar.gz
            dist/rs-udp-sender-${{ needs.test.outputs.version }}-darwin-arm64.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
          draft: false
          prerelease: ${{ needs.test.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Homebrew ───────────────────────────────────────────────────────
  homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: [test, release]
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: rgnv/homebrew-rs-udp-sender
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download release artifacts and compute SHA256
        run: |
          V="${{ needs.test.outputs.version }}"
          BASE="https://github.com/rgnv/rs-udp-sender/releases/download/${V}"

          DL() { curl -sSfL "${BASE}/rs-udp-sender-${V}-$1-x64.tar.gz" -o "/tmp/$1-amd64.tar.gz"; }
          SHA() { sha256sum "/tmp/$1-amd64.tar.gz" | awk '{print $1}'; }

          DL linux; DL darwin

          if [ "$(uname -m)" != "arm64" ] && [ "$(uname -m)" != "aarch64" ]; then
            DL2() { curl -sSfL "${BASE}/rs-udp-sender-${V}-$1-arm64.tar.gz" -o "/tmp/$1-arm64.tar.gz"; }
            SHA2() { sha256sum "/tmp/$1-arm64.tar.gz" | awk '{print $1}'; }
            DL2 linux; DL2 darwin
            SHA_LINUX_ARM64=$(SHA2 linux)
            SHA_DARWIN_ARM64=$(SHA2 darwin)
          fi

          SHA_LINUX_AMD64=$(SHA linux)
          SHA_DARWIN_AMD64=$(SHA darwin)

          sed -i "s/{{VERSION}}/${V}/" Formula/rs-udp-sender.rb
          sed -i "s/{{SHA256_DARWIN_AMD64}}/${SHA_DARWIN_AMD64}/" Formula/rs-udp-sender.rb
          sed -i "s/{{SHA256_DARWIN_ARM64}}/${SHA_DARWIN_ARM64:-${SHA_DARWIN_AMD64}}/" Formula/rs-udp-sender.rb
          sed -i "s/{{SHA256_LINUX_AMD64}}/${SHA_LINUX_AMD64}/" Formula/rs-udp-sender.rb
          sed -i "s/{{SHA256_LINUX_ARM64}}/${SHA_LINUX_ARM64:-${SHA_LINUX_AMD64}}/" Formula/rs-udp-sender.rb

          echo "Homebrew formula updated for version ${V}"

      - name: Push formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rs-udp-sender.rb
          git commit -m "Update formula for ${{ needs.test.outputs.version }}" || true
          git push origin master

  # ── Summary ────────────────────────────────────────────────────────
  summary:
    name: Release Summary
    needs: [test, release, homebrew]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print summary
        run: |
          V="${{ needs.test.outputs.version }}"
          PV="${{ needs.test.outputs.pkg_version }}"

          {
            echo "## Release ${V} Published! 🚀"
            echo ""
            echo "### Built Artifacts"
            echo "- ✅ Linux x64 tarball"
            echo "- ✅ Linux ARM64 tarball"
            echo "- ✅ macOS x64 tarball"
            echo "- ✅ macOS ARM64 tarball"
            echo "- ✅ DEB (x64, arm64)"
            echo "- ✅ RPM (x64, arm64)"
            echo ""
            echo "### Container Images"
            echo "- ✅ \`ghcr.io/${{ github.repository }}:${PV}\`"
            echo "- ✅ \`ghcr.io/${{ github.repository }}:latest\`"
            echo "- Architectures: linux/amd64, linux/arm64"
            echo ""
            echo "### Release URL"
            echo "https://github.com/${{ github.repository }}/releases/tag/${V}"
            echo ""
            echo "### Homebrew"
            echo "- ✅ Formula updated in rgnv/homebrew-rs-udp-sender"
            echo '- `brew tap rgnv/rs-udp-sender && brew install rs-udp-sender`'
          } >> "$GITHUB_STEP_SUMMARY"
